<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Act</title>

    <style>
     

        .mover {
        width: 100px;
        height: 100px;
        background-color: crimson;
        color: white;
        text-align: center;
        margin-bottom: 10px;
        animation: moverAnim 3s infinite ease-in-out;
    }
 
    .escalar {
        width: 100px;
        height: 100px;
        background-color: crimson;
        color: white;
        text-align: center;
        margin-bottom: 10px;
        animation: escalarAnim 3s infinite ease-in-out;
    }
 
    .rotar {
        width: 100px;
        height: 100px;
        background-color: crimson;
        color: white;
        text-align: center;
        margin-bottom: 10px;
        animation: rotarAnim 3s infinite linear;
    }
 
    .color {
        width: 100px;
        height: 100px;
        background-color: crimson;
        color: white;
        text-align: center;
        margin-bottom: 10px;
        animation: colorAnim 3s infinite ease-in-out;
    }
     .todos {
        width: 100px;
        height: 100px;
        background-color: crimson;
        color: white;
        text-align: center;
        margin-bottom: 10px;
        animation: 
        colorAnim 3s infinite ease-in-out, todoJuntoAnim 3s infinite ease-in-out;
    }
@keyframes moverAnim {
        0% {
            transform: translateX(0);
        }
        100% {
            transform: translateX(150px);
        }
    }
 
    @keyframes escalarAnim {
        0% {
            transform: scale(1);
        }
        100% {
            transform: scale(1.5);
        }
    }
    @keyframes rotarAnim {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
 
    @keyframes colorAnim {
        0% {
            background-color: crimson;
        }
 
        100% {
            background-color: dodgerblue;
        }
    }
    @keyframes todoJuntoAnim {
        0% {
            transform: translateX(0) scale(1) rotate(0deg);
        }
        100% {
            transform: translateX(150px) scale(1.5) rotate(360deg);
        }
    }
    @font-face {
       font-family: 'Narnia';
       src: url('fonts/Narnia-Regular.ttf') format('truetype');
       font-weight: 300;
       font-style: normal;
    }
    h1{
         font-family: 'Narnia';
        text-align: center;
        margin-top: 50px;
        margin-bottom: 0px;
        font-size:90px ;
    }
    h3{
        font-family:'Montserrat', sans-serif;
        text-align: center;
        margin-left: 150px;
        margin-right: 150px;
        font-size: 22px;
    }
    a{
        font-family:'Montserrat', sans-serif;
        text-align: center;
        margin-left: 700px;
        margin-right: 700px;
    }
</style>

    </head>

    <h3>Su objetivo es dar feedback al usuario, bien sobre una acción que ha realizado, o bien sobre el estado del sistema, que se comunica a través de cambios visuales en la interfaz.  </h2>
